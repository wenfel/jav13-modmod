name: weapon-catalog-toolkit-smoke

on:
  push:
    branches:
      - feature/weapon-catalog-toolkit

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        run: python3 tools/weapon-catalog/test_weapon_catalog.py

      - name: Production catalogue validate and index
        run: |
          python3 tools/weapon-catalog/weapon_catalog.py validate \
            --items gamedir/Data-1.13/TableData/Items/Items.xml \
            --weapons gamedir/Data-1.13/TableData/Items/Weapons.xml \
            --source data-1.13 \
            --output /tmp/validate.json | tee /tmp/validate.stdout
          test "${PIPESTATUS[0]}" -eq 0
          test "$(wc -l < /tmp/validate.stdout)" -le 5
          python3 tools/weapon-catalog/weapon_catalog.py index \
            --items gamedir/Data-1.13/TableData/Items/Items.xml \
            --weapons gamedir/Data-1.13/TableData/Items/Weapons.xml \
            --source data-1.13 \
            --output /tmp/catalog.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/catalog.json", encoding="utf-8"))
          items=d["source_files"]["items"]
          weapons=d["source_files"]["weapons"]
          validation=d["validation"]
          assert items["root"].upper() in {"ITEMLIST","ITEMS"}
          assert weapons["root"].upper()=="WEAPONLIST"
          assert d["stats"]["weapon_records"] > 300
          assert items["records"] > d["stats"]["weapon_records"]
          assert not items["duplicate_ids"]
          assert not weapons["duplicate_ids"]
          assert items["invalid_id_records"] == 0
          assert weapons["invalid_id_records"] == 0
          assert validation["unique_item_ids"]
          assert validation["unique_weapon_ids"]
          assert not validation["weapon_ids_missing_item_record"]
          print("production_validation_invariants=ok")
          PY

      - name: Production LOBOT and attachment lookup
        run: |
          python3 tools/weapon-catalog/weapon_catalog.py lobot \
            --filters gamedir/Base/TableData/LogicalBodyTypes/Filters.xml \
            --id 632 --donor 762 --include-generic --limit 100000 \
            --output /tmp/lobot.json | tee /tmp/lobot.stdout
          test "$(wc -l < /tmp/lobot.stdout)" -le 10
          python3 tools/weapon-catalog/weapon_catalog.py attachments \
            --attachments gamedir/Data-1.13/TableData/Items/Attachments.xml \
            --id 632 --limit 100000 \
            --output /tmp/attachments.json | tee /tmp/attachments.stdout
          test "$(wc -l < /tmp/attachments.stdout)" -le 102
          python3 - <<'PY'
          import json
          lobot=json.load(open("/tmp/lobot.json", encoding="utf-8"))
          att=json.load(open("/tmp/attachments.json", encoding="utf-8"))
          assert "632" in lobot["targets"]
          assert "762" in lobot["donors"]
          assert "generic_filters" in lobot
          assert "matches" in att
          print("relationship_lookup_assertions=ok")
          PY
